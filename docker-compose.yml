x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  api_geteway:
    build:
      context: ./apps/api_geteway
      dockerfile: Dockerfile
    container_name: api_geteway
    env_file:
      - .env.local
    ports:
      - "2300:2300"
    logging: *default-logging
    depends_on:
      - db
      - minio

  db:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env.local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging: *default-logging
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./storage/redis_data:/data
    env_file:
      - .env.local
    command: redis-server --protected-mode yes --requirepass $REDIS_PASSWORD
  minio:
    image: minio/minio:latest
    container_name: hanami_minio
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres-data:
  minio-data: